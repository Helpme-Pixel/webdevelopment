<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Kalender december 2025</title>
    <style>
        table.calendar {
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }
        .calendar th.month {
            background-color: rgb(170, 170, 200);
            color: #000;
            font-weight: bold;
            padding: 2px;
        }
        .calendar th.day {
            background-color: rgb(35, 37, 70);
            color: rgb(200, 190, 240);
            padding: 2px 4px;
        }
        .calendar td {
            border: 1px dotted #444;
            width: 24px;
            height: 22px;
            text-align: center;
            padding: 2px;
        }
        .calendar td a {
            color: blue;
        }
        .calendar td:first-child,
        .calendar td:last-child {
            background-color: rgb(255, 220, 220);
        }
        .calendar td.other {
            color: #999;
            background-color: rgb(200, 200, 200);
        }
        .calendar td.holiday {
            background-color: rgb(250, 120, 120);
        }
    </style>
</head>
<body>

<table class="calendar">
    <tr>
        <th class="month" colspan="7">December 2025</th>
    </tr>
    <tr>
        <th class="day">Sun</th>
        <th class="day">Mon</th>
        <th class="day">Tue</th>
        <th class="day">Wed</th>
        <th class="day">Thu</th>
        <th class="day">Fri</th>
        <th class="day">Sat</th>
    </tr>
    <tr>
        <td class="other">30</td>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td><a href="#">4</a></td>
        <td><a href="#">5</a></td>
        <td class="holiday">6</td>
    </tr>
    <tr>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td><a href="#">10</a></td>
        <td><a href="#">11</a></td>
        <td>12</td>
        <td>13</td>
    </tr>
    <tr>
        <td>14</td>
        <td><a href="#">15</a></td>
        <td>16</td>
        <td>17</td>
        <td>18</td>
        <td><a href="#">19</a></td>
        <td>20</td>
    </tr>
    <tr>
        <td>21</td>
        <td>22</td>
        <td><a href="#">23</a></td>
        <td>24</td>
        <td class="holiday">25</td>
        <td>26</td>
        <td>27</td>
    </tr>
    <tr>
        <td>28</td>
        <td>29</td>
        <td>30</td>
        <td>31</td>
        <td class="other holiday">1</td>
        <td class="other">2</td>
        <td class="other">3</td>
    </tr>
</table>
